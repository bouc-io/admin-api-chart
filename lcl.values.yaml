# Local environment values for admin-api-chart
# Only include values that differ from base or are required for local

image:
  registry: ghcr.io/bouc-io
  repository: application/admin/admin-api-server
  tag: "latest"
  pullPolicy: IfNotPresent
  # tag will be managed by FluxCD, do not set here

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

postgresql:
  enabled: true
  global:
    security:
      allowInsecureImages: true # Required now since we move to Bitnami Legacy for now.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r18
  auth:
    username: ps_admin
    database: ps_admin_db
    # Both the bundled Postgres and the app read from this ESO-managed Secret:
    # Postgres takes the `password` key, the app takes the `DATABASE_URL` key that
    # the ExternalSecret template assembles. Keep username and database in sync
    # with the DSN in infrastructure/external-secrets/externalsecrets/local/.
    existingSecret: boucio-admin-db-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  architecture: standalone

environment:
  # Environment identity for telemetry labels. ${ENVIRONMENT_ID} is substituted from the
  # manually-created cluster-vars ConfigMap by Flux postBuild (local-config Kustomization).
  ENVIRONMENT_ID: "${ENVIRONMENT_ID}"
  NODE_ENV: "development"
  PORT: 3002
  LOG_LEVEL: "debug"
  ALLOW_SELF_SIGNED_CERTS: "true"
  KEYCLOAK_ADMIN_URL: "https://authn.app.pik8s.internal"
  KEYCLOAK_REALM: "users"
  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_GRANT_TYPE: "password"
  AGENT_API_URL: "http://agent-api-chart.default.svc.cluster.local:80"
  MEMORY_API_URL: "http://memory-api-chart.default.svc.cluster.local:80"
  CHATBOT_API_URL: "http://chatbot-api-chart.default.svc.cluster.local:80"
  OLLAMA_URL: "http://ollama-chart.default.svc.cluster.local:11434"

externalDatabase:
  host: ""
  port: 5432
  user: bn_admin
  database: bitnami_admin
  password: ""
  existingSecret: ""
  existingSecretHostKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  existingSecretDatabaseKey: ""
  existingSecretPasswordKey: ""
  annotations: {}
